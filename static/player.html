<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Read Receipts</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/app.css">
<style>
  body{display:flex;justify-content:center}
  #app{
    position:relative;z-index:1;
    /* min-width:0 because this is a flex item: min-width:auto beats
       max-width, so one child wider than the column would drag the whole
       page sideways rather than overflow inside it. */
    width:100%;max-width:460px;min-width:0;min-height:100vh;
    padding:calc(18px + env(safe-area-inset-top)) 20px
            calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
  }

  .bar{
    display:flex;align-items:center;gap:10px;
    padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:20px;
  }
  .bar .me{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .bar .me .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
  .bar .rd{margin-left:auto;font-family:var(--mono);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .bar .sc{font-family:var(--mono);font-size:15px;font-weight:700}

  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}

  h1.big{font-family:var(--display);font-weight:900;letter-spacing:-.03em;
    line-height:.95;font-size:clamp(40px,13vw,58px)}
  .lede{color:var(--muted);font-size:16px;max-width:32ch}

  .prompt{font-family:var(--display);font-variation-settings:"opsz" 40;
    font-weight:600;font-size:23px;line-height:1.22;letter-spacing:-.01em}
  .bubble{font-size:16px;line-height:1.45}
  /* The phone is not the screen the photo is for — the big one is. Keep it
     small enough that the options stay above the fold. */
  .photo img{max-height:32vh}

  /* the read receipt (DESIGN 2.4) */
  .sentwrap{display:flex;justify-content:flex-end}
  .bubble.sent{
    max-width:78%;padding:12px 16px;border-radius:20px 20px 5px 20px;
    color:var(--night);font-weight:700;
    animation:send .4s cubic-bezier(.2,1.1,.3,1) both;
  }
  @keyframes send{from{opacity:0;transform:translateY(12px) scale(.94)}
                  to{opacity:1;transform:none}}
  .receipt{
    text-align:right;font-family:var(--mono);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    margin-top:7px;transition:color .3s ease;
  }
  .receipt.read{color:var(--cream)}
  .awaiting{display:flex;align-items:center;gap:10px;margin-top:26px}
  .awaiting .nm{font-weight:700;font-size:15px}

  .opts{display:flex;flex-direction:column;gap:9px}
  /* 40ms apart, so the options arrive rather than appear (DESIGN §6) */
  .opts button{animation:optin .3s cubic-bezier(.2,1.1,.3,1) both}
  @keyframes optin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .opts button.emoji{font-size:32px;text-align:center;padding:16px}

  .slider-val{font-family:var(--mono);font-size:25px;font-weight:700;text-align:center}

  /* The density histogram behind the month slider. One bar per month, height
     by volume — she is sliding across a picture of the thread, and the spikes
     are landmarks (PLAN S3.1). Bars are centred on the value they represent,
     not laid out edge to edge, so bar i sits under the thumb at value i. */
  .monthpick{position:relative;padding-top:6px}
  .density{position:relative;height:56px;margin-bottom:-6px;pointer-events:none}
  .density b{
    position:absolute;bottom:0;transform:translateX(-50%);
    background:rgba(239,231,222,.16);border-radius:2px 2px 0 0;
    transition:background .18s ease,opacity .18s ease;
  }
  .density b.on{background:currentColor;opacity:.95}
  .density b.near{background:rgba(239,231,222,.34)}

  .count{font-family:var(--display);font-weight:900;font-size:clamp(90px,32vw,150px);
    text-align:center;line-height:1;letter-spacing:-.05em;
    animation:tick .9s cubic-bezier(.2,1.2,.3,1) both}
  @keyframes tick{from{opacity:0;transform:scale(.55)}60%{opacity:1}to{opacity:.15;transform:scale(1.2)}}

  .verdict{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
  .verdict .pts{font-family:var(--mono);font-weight:700;font-size:52px;line-height:1}
  .verdict .lab{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.02em}
  .verdict .sub{color:var(--muted);font-size:15px}

  .truth{border-left:2px solid currentColor;padding-left:14px;font-size:15px;line-height:1.45}
  .truth .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px}

  .mini{display:flex;flex-direction:column;gap:8px}
  .mini .row{display:flex;align-items:center;gap:11px;background:var(--raised);
    border-radius:13px;padding:12px 15px;font-size:15px}
  .mini .row .nm{flex:1;font-weight:700}
  .mini .row .sc{font-family:var(--mono);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>

<script src="/static/shared.js"></script>
<script>
const app = document.getElementById("app");
let S = null, me = null, pending = null, lastKey = "";

/* stable id so a refresh or a locked screen doesn't lose your score */
let myId = sessionStorage.getItem("rr_id");
if (!myId) {
  myId = Math.random().toString(36).slice(2, 10);
  sessionStorage.setItem("rr_id", myId);
}
let myName = sessionStorage.getItem("rr_name") || "";
let denied = false;

/* The QR carries the code, so a scan is the whole journey. Typing it is the
   fallback for the person who reads it off the big screen. */
const fromUrl = new URLSearchParams(location.search).get("c");
setCode(fromUrl || sessionStorage.getItem("rr_code") || "");
if (joinCode) sessionStorage.setItem("rr_code", joinCode);

function onOpenExtra() {
  if (myName && joinCode) doJoin();
}

function doJoin() {
  sessionStorage.setItem("rr_name", myName);
  sessionStorage.setItem("rr_code", joinCode);
  send({ t: "join", id: myId, name: myName, code: joinCode });
}

function onDenied(why) {
  denied = true;
  if (why === "code") {
    sessionStorage.removeItem("rr_code");
    setCode("");
  }
  joinView();
}

/* ------------------------------------------------------------------ chrome */

function bar() {
  const b = h("div", "bar");
  if (me) {
    const who = h("div", "me");
    who.style.color = me.color;
    who.append(h("span", "dot"), textNode(me.name, "var(--cream)"));
    b.append(who, h("div", "sc", String(me.score)));
    b.querySelector(".sc").style.color = me.color;
  }
  if (S.phase !== "lobby" && S.phase !== "final") {
    b.append(h("div", "rd", `Round ${S.round + 1}/${S.rounds}`));
  }
  return b;
}

function stage(...kids) {
  const s = h("div", "stage fade");
  s.append(...kids.filter(Boolean));
  return s;
}

function paint(...kids) {
  app.replaceChildren();
  if (me) app.append(bar());
  app.append(stage(...kids));
}

/* ------------------------------------------------------------------- views */

function joinView() {
  const title = h("h1", "big");
  title.append(document.createTextNode("Read"), h("br"),
               document.createTextNode("Receipts"));
  const lede = h("p", "lede", "Put in a name. Your partner sees it on the big screen.");

  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "Your name";
  input.maxLength = 18;
  input.value = myName;
  input.autocomplete = "off";

  const code = document.createElement("input");
  code.type = "text";
  code.className = "code";
  code.placeholder = "CODE";
  code.maxLength = 4;
  code.size = 4;                 // or it reserves room for twenty characters
  code.autocapitalize = "characters";
  code.autocomplete = "off";
  code.spellcheck = false;
  code.setAttribute("aria-label", "Join code from the big screen");
  code.oninput = () => {
    code.value = code.value.toUpperCase().replace(/[^A-Z]/g, "");
    check();
  };

  const known = h("div", "gotcode", `Code ${joinCode} ✓`);
  const go = h("button", "cta", "I'm in");

  const ready = () => input.value.trim() && (joinCode || code.value.length === 4);
  const check = () => { go.disabled = !ready(); };
  input.oninput = check;
  const submit = () => {
    if (!ready()) return;
    myName = input.value.trim();
    if (!joinCode) setCode(code.value);
    doJoin();
  };
  go.onclick = submit;
  for (const el of [input, code]) {
    el.onkeydown = e => { if (e.key === "Enter") submit(); };
  }

  const kids = [title, lede];
  if (denied) {
    lede.textContent = "That code isn't right. It's on the big screen.";
    lede.style.color = "var(--wrong)";
  }
  kids.push(joinCode ? known : code, input, go);
  check();

  app.replaceChildren();
  app.append(stage(...kids));
  setTimeout(() => (joinCode ? input : code).focus(), 120);
}

function lobbyView() {
  const dots = h("div", "dots");
  dots.append(h("i"), h("i"), h("i"));
  const head = h("h2", "prompt", "You're in.");
  const lede = h("p", "lede",
    S.players.length > 1
      ? "Everyone's here. Waiting on the host to start."
      : "Waiting for the other phone to join.");

  const mini = h("div", "mini");
  S.players.forEach(p => {
    const row = h("div", "row");
    row.style.color = p.color;
    row.append(h("span", "dot"), textNode(p.name, "var(--cream)", "nm"));
    row.querySelector(".dot").style.cssText =
      "width:10px;height:10px;border-radius:50%;background:currentColor";
    mini.append(row);
  });

  paint(dots, head, lede, mini);
}

function countdownView() {
  const left = Math.max(1, Math.ceil(3 - (serverNow() - S.now)));
  paint(h("div", "count", String(left)));
  setTimeout(() => { if (S.phase === "countdown") countdownView(); }, 900);
}

function questionView() {
  const q = S.question;
  const key = `${S.round}:${S.phase}`;
  const locked = S.answered.includes(myId);

  if (locked) return lockedView();
  if (key === lastKey && app.querySelector(".opts, input, .slider-val")) return;
  /* One nudge per round, not per render: `lastKey` already exists to stop a
     re-render rebuilding the inputs, and it is the same guard this wants. */
  if (key !== lastKey) Haptic.open();
  lastKey = key;
  pending = null;

  const tint = me ? me.color : "var(--cream)";
  const kids = [h("div", "eyebrow", q.kind)];
  /* Before the prompt, not after: the rules of this round change what the
     prompt even means. */
  if (q.type === "mutual") kids.push(samePageBanner());
  kids.push(h("h2", "prompt", q.prompt));
  const block = messageBlock(q, "bubble");   // `format`, read — see shared.js
  if (block) kids.push(block);

  const lock = h("button", "cta", "Lock it in");
  lock.disabled = true;
  const enable = v => { pending = v; lock.disabled = false; };

  /* The Final Receipt. The stake goes up before the options, because that is
     the order you decide in: how much this is worth to you, then who you
     think it was. Both travel in one message — see Game.record_answer. */
  let stake = null, picked = null;
  if (q.type === "wager") {
    /* Never above what you actually have, rounded down to the slider's step,
       and never below the floor Game.stake_cap grants everyone — at zero
       points there is nothing to risk and the last round is a formality. */
    const cap = Math.max(500, Math.floor((me ? me.score : 0) / 50) * 50);
    stake = Math.round(cap / 2 / 50) * 50;
    const out = h("div", "slider-val", "Staking " + stake.toLocaleString());
    out.style.color = tint;
    const sl = document.createElement("input");
    sl.type = "range"; sl.min = 0; sl.max = cap; sl.step = 50; sl.value = stake;
    sl.style.color = tint;
    sl.setAttribute("aria-label", "How much to stake");
    sl.oninput = () => {
      stake = parseInt(sl.value, 10);
      out.textContent = stake ? "Staking " + stake.toLocaleString() : "Staking nothing";
      if (picked !== null) enable({ pick: picked, stake });
    };
    const ends = h("div", "ends");
    ends.append(h("span", null, "Nothing"), h("span", null, "All in"));
    const box = h("div", "monthpick");
    box.append(out, sl, ends);
    kids.push(h("p", "lede", "Last round. Stake what you like, then answer — " +
                             "right and you win it, wrong and you lose it."), box);
  }

  if (q.options) {
    const wrap = h("div", "opts");
    const isEmoji = q.options.every(o => o.length <= 3 && !/[a-z0-9]/i.test(o));
    q.options.forEach((opt, i) => {
      const b = h("button", isEmoji ? "emoji" : null, opt);
      b.style.animationDelay = (i * 0.04) + "s";
      b.style.color = q.type === "binary"
        ? (i === 0 ? "var(--p1,#F2A65A)" : "#8B8CE8")
        : tint;
      b.onclick = () => {
        wrap.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
        b.classList.add("sel");
        picked = i;
        Haptic.tap();
        enable(q.type === "wager" ? { pick: i, stake } : i);
      };
      wrap.append(b);
    });
    kids.push(wrap);
  } else if (q.type === "number") {
    const inp = document.createElement("input");
    inp.type = "number"; inp.inputMode = "numeric"; inp.placeholder = "0";
    inp.style.color = tint;
    inp.oninput = () => {
      const v = parseInt(inp.value, 10);
      if (Number.isFinite(v) && v >= 0) enable(v);
      else { pending = null; lock.disabled = true; }
    };
    kids.push(inp);
  } else if (q.type === "month") {
    const months = S.meta.months;
    const mid = Math.floor(months.length / 2);
    const out = h("div", "slider-val", monthLabel(months[mid]));
    out.style.color = tint;
    const sl = document.createElement("input");
    sl.type = "range"; sl.min = 0; sl.max = months.length - 1; sl.value = mid;
    sl.style.color = tint;
    sl.setAttribute("aria-label", "Pick a month");
    sl.oninput = () => { out.textContent = monthLabel(months[sl.value]);
                         enable(parseInt(sl.value, 10)); };
    const ends = h("div", "ends");
    ends.append(h("span", null, monthLabel(months[0])),
                h("span", null, monthLabel(months[months.length - 1])));

    const hist = q.histogram === false ? null : density(months.length, tint);
    if (hist) {
      sl.addEventListener("input", () => hist.mark(parseInt(sl.value, 10)));
      hist.mark(mid);
    }

    const box = h("div", "monthpick");
    /* filter, not `hist && hist.el` — append(null) writes the text "null" */
    box.append(...[out, hist && hist.el, sl, ends].filter(Boolean));
    kids.push(box);
    enable(mid);
  } else if (q.type === "percent") {
    /* Same shape as the month slider, minus the histogram — there is nothing
       to draw behind a percentage. Starts at 50 and is pre-enabled, so a
       question you have no feel for still costs you a tap, not the round. */
    const out = h("div", "slider-val", "50%");
    out.style.color = tint;
    const sl = document.createElement("input");
    sl.type = "range"; sl.min = 0; sl.max = 100; sl.value = 50;
    sl.style.color = tint;
    sl.setAttribute("aria-label", "Pick a percentage");
    sl.oninput = () => { out.textContent = sl.value + "%";
                         enable(parseInt(sl.value, 10)); };
    const ends = h("div", "ends");
    ends.append(h("span", null, "0%"), h("span", null, "100%"));
    const box = h("div", "monthpick");
    box.append(out, sl, ends);
    kids.push(box);
    enable(50);
  }

  const timer = h("div", "timer");
  const fill = h("span");
  timer.append(fill);
  kids.push(timer);

  lock.onclick = () => {
    /* Stamped with our estimate of the server's clock, not the server's
       receipt time — otherwise the slower connection pays for its latency on
       every round. The server clamps it into the question window. */
    send({ t: "answer", id: myId, value: pending, at: serverNow() });
    Haptic.lock();
    sent = { round: S.round, value: pending };
    lockedView();
  };
  kids.push(lock);

  paint(...kids);
  runTimer(timer, fill);
}

/* One bar per month, scaled to the busiest one. Returns null when the dataset
   predates `meta.density` — an older compile still plays, it just plays
   without the picture. */
function density(n, tint) {
  const d = S.meta && S.meta.density;
  if (!Array.isArray(d) || d.length !== n || n < 2) return null;

  const peak = Math.max(...d, 1);
  const el = h("div", "density");
  el.style.color = tint;
  const bars = d.map((v, i) => {
    const b = h("b");
    /* sqrt, not linear: one frantic month would otherwise flatten five years
       into a single spike and a floor. */
    b.style.height = Math.max(2, Math.round(Math.sqrt(v / peak) * 54)) + "px";
    b.style.left = (i / (n - 1)) * 100 + "%";
    b.style.width = Math.max(2, Math.floor(280 / n)) + "px";
    el.append(b);
    return b;
  });

  return {
    el,
    mark(i) {
      bars.forEach((b, j) => {
        b.className = j === i ? "on" : (Math.abs(j - i) <= 1 ? "near" : "");
      });
    },
  };
}

/* What we sent this round, so the locked screen can show it back as a sent
   bubble. The server does not echo it — an answer is secret until the reveal,
   including from the person who gave it, as far as the wire is concerned. */
let sent = null;

/* The read receipt (DESIGN 2.4). Your answer as a sent bubble in your colour,
   `Delivered` under it, and the moment she answers it flips to `Read 9:42 PM`.
   The game is named after this screen; it should use the vocabulary. */
function lockedView() {
  lastKey = "";
  const kids = [];
  const tint = me ? me.color : "var(--cream)";

  if (sent && sent.round === S.round && S.question) {
    const out = h("div", "sentwrap");
    const b = h("div", "bubble sent", shownGuess(S.question, sent.value, S));
    b.style.background = tint;
    out.append(b);
    kids.push(out);
  } else {
    kids.push(h("h2", "prompt", "Locked in."));
  }

  const others = S.players.filter(p => p.id !== myId);
  const waiting = others.filter(p => !S.answered.includes(p.id));
  const read = others.find(p => S.answered.includes(p.id)
                                && typeof p.took === "number");

  /* Her clock time, not ours: the question started at endsAt - seconds on the
     server, and `took` is measured from there. Deriving it means a reconnect
     mid-round still shows the right time instead of the time we noticed. */
  let stamp = null;
  if (read && S.endsAt) {
    const at = new Date((S.endsAt - S.seconds + read.took) * 1000);
    stamp = at.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  const receipt = h("div", "receipt", waiting.length ? "Delivered"
                    : stamp ? `Read ${stamp}` : "Read");
  if (!waiting.length) receipt.classList.add("read");
  kids.push(receipt);

  if (waiting.length) {
    const who = h("div", "awaiting");
    who.append(h("div", "nm", waiting.map(p => p.name).join(", ")));
    const dots = h("div", "dots");
    dots.append(h("i"), h("i"), h("i"));
    if (waiting.length === 1) dots.style.color = waiting[0].color;
    who.append(dots);
    kids.push(who);
  } else {
    kids.push(h("p", "lede", "Everyone's answered. Look up."));
  }

  const timer = h("div", "timer");
  const fill = h("span");
  timer.append(fill);
  paint(...kids, S.endsAt ? timer : null);
  if (S.endsAt) runTimer(timer, fill);
}

/* A verdict that knows what you were guessing at (DESIGN 2.5). "Off by one
   month" is a result; "Not quite" is a shrug, and after fourteen rounds of
   shrugs the phone has stopped saying anything. */
function verdict(q, mine, acc, S) {
  if (!mine || mine.answer === null || mine.answer === undefined) return "No answer";

  /* Mutual has no truth to be near, so "Nailed it" would be claiming one. */
  if (q.type === "mutual") {
    if (acc < 0.999) return "You two disagreed";
    /* Who got the first-in bonus, worked out from the board rather than from a
       number the server would have to send: on a round everyone agreed on, the
       one who was first is the one who scored most. */
    const others = S.players.filter(p => p.id !== myId && p.last);
    const best = Math.max(0, ...others.map(p => p.last.points));
    return mine.points > best ? "Same brain — and you got there first"
                              : "Same brain";
  }

  if (q.type === "wager") {
    const st = (mine.stake || 0).toLocaleString();
    if (!mine.stake) return acc >= 0.999 ? "Right, and you risked nothing"
                                         : "Wrong, but you risked nothing";
    return acc >= 0.999 ? `Worth every one of those ${st}`
                        : `That cost you ${st}`;
  }

  if (acc >= 0.999) return "Nailed it";

  if (q.type === "month" && typeof mine.answer === "number"
      && typeof q.answer === "number") {
    const off = Math.abs(mine.answer - q.answer);
    if (off === 1) return "Off by one month";
    if (off <= 3) return `Off by ${off} months`;
    if (off <= 12) return "Off by the better part of a year";
    return "Wrong year entirely";
  }

  /* A percentage is scored on a flat 30-point band, not a relative one, so
     the verdict has to read the same way — off by 7 on an answer of 3% is a
     near miss worth most of the points, and calling it "wildly over" while
     paying out 500 makes the phone look like it isn't watching. The 30 here
     is the same 30 as in Game.accuracy: past it you scored nothing, and only
     past it does it say so. */
  if (q.type === "percent"
      && typeof mine.answer === "number" && typeof q.answer === "number") {
    const d = mine.answer - q.answer;
    const off = Math.abs(d);
    if (off <= 2) return "Almost exactly";
    if (off <= 10) return d > 0 ? "A bit high" : "A bit low";
    if (off < 30) return `${d > 0 ? "High" : "Low"} by ${Math.round(off)} points`;
    return d > 0 ? "Wildly over" : "Wildly under";
  }

  if (q.type === "number"
      && typeof mine.answer === "number" && typeof q.answer === "number") {
    const d = mine.answer - q.answer;
    const near = Math.abs(d) / Math.max(Math.abs(q.answer), 1);
    if (near <= 0.05) return "Almost exactly";
    if (near <= 0.25) return d > 0 ? "A bit high" : "A bit low";
    return d > 0 ? "Wildly over" : "Wildly under";
  }

  return acc > 0 ? "Close" : "Not even close, love";
}

let buzzedReveal = -1;

function revealView() {
  lastKey = "";
  const q = S.question;
  const mine = me && me.last ? me.last : null;
  const pts = mine ? mine.points : 0;
  /* Once per round. A phone reconnecting mid-reveal re-renders this view, and
     being buzzed twice for the same answer reads as a bug. */
  if (buzzedReveal !== S.round) {
    buzzedReveal = S.round;
    if (pts > 0) Haptic.good(); else Haptic.bad();
  }
  const acc = mine ? mine.accuracy : 0;

  const v = h("div", "verdict");
  const label = verdict(q, mine, acc, S);
  /* A lost wager is the only negative in the game, and "+-800" is not a
     number anyone reads. */
  const p = h("div", "pts", (pts < 0 ? "−" : "+") + Math.abs(pts).toLocaleString());
  p.style.color = pts > 0 ? "var(--right)" : "var(--wrong)";
  v.append(p, h("div", "lab", label));
  v.append(h("div", "sub", "You said " + shownGuess(q, mine ? mine.answer : null, S)));

  const truth = h("div", "truth");
  truth.style.color = me ? me.color : "var(--cream)";
  truth.append(h("div", "lab", q.type === "mutual" ? "No right answer" : "The truth"),
               textNode(q.reveal, "var(--cream)"));

  const mini = h("div", "mini");
  S.players.forEach((pl, i) => {
    const row = h("div", "row");
    row.style.color = pl.color;
    row.append(textNode(`#${i + 1}`, "var(--muted)"),
               textNode(pl.name, "var(--cream)", "nm"),
               h("div", "sc", String(pl.score)));
    mini.append(row);
  });

  paint(v, truth, mini);
}

function finalView() {
  const order = S.players;
  const won = order.length && order[0].id === myId;
  const tie = order.length > 1 && order[0].score === order[1].score;

  const head = h("h1", "big", tie ? "Dead heat." : won ? "You win." : "You lost.");
  const lede = h("p", "lede", won && !tie
    ? "Superior recall. Insufferable about it, presumably."
    : tie ? "Suspiciously well matched."
          : "The receipts don't lie.");

  const mini = h("div", "mini");
  order.forEach((pl, i) => {
    const row = h("div", "row");
    row.style.color = pl.color;
    row.append(textNode(`#${i + 1}`, "var(--muted)"),
               textNode(pl.name, "var(--cream)", "nm"),
               h("div", "sc", pl.score.toLocaleString()));
    mini.append(row);
  });

  paint(head, lede, mini);
}

/* ------------------------------------------------------------------- timer */

let raf = null;
function runTimer(bar, fill) {
  cancelAnimationFrame(raf);
  if (!S.endsAt) return;
  const total = S.seconds * 1000;
  const step = () => {
    const left = Math.max(0, (S.endsAt - serverNow()) * 1000);
    fill.style.transform = `scaleX(${left / total})`;
    bar.classList.toggle("urgent", left < total * 0.28);
    if (left > 0 && document.body.contains(bar)) raf = requestAnimationFrame(step);
  };
  step();
}

/* ------------------------------------------------------------------ router */

connect("player", s => {
  S = s;
  me = s.players.find(p => p.id === myId) || null;

  if (!me) return joinView();
  denied = false;
  if (s.phase === "lobby") return lobbyView();
  if (s.phase === "countdown") { lastKey = ""; return countdownView(); }
  if (s.phase === "question") return questionView();
  if (s.phase === "reveal") return revealView();
  if (s.phase === "final") return finalView();
});
</script>
