<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Read Receipts — host</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/app.css">
<style>
  #host{
    position:relative;z-index:1;
    min-height:100vh;
    max-width:1100px;margin:0 auto;
    padding:34px 44px 44px;
    display:flex;flex-direction:column;gap:26px;
  }
  .topbar{display:flex;align-items:center;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .topbar .mark{font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:-.02em}
  .topbar .spacer{margin-left:auto}
  .pill{
    font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);padding:6px 13px;border-radius:99px;background:var(--raised);
  }

  .main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px}

  /* lobby */
  .lobby{display:grid;grid-template-columns:1.25fr .75fr;gap:52px;align-items:center}
  .lobby h1{font-size:clamp(52px,7vw,92px)}
  .lobby h1 .thin{
    display:block;font-weight:400;font-style:italic;font-size:.36em;
    color:var(--muted);letter-spacing:-.01em;margin-top:16px;
  }
  .joinbox{
    background:var(--raised);border-radius:24px;padding:26px;
    display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;
  }
  .joinbox .url{font-family:var(--mono);font-size:17px;font-weight:700;word-break:break-all}
  .joinbox svg{width:180px;height:180px;display:block}
  .roster{display:flex;flex-wrap:wrap;gap:11px;min-height:56px}
  .who{
    display:flex;align-items:center;gap:10px;
    background:var(--raised);border-radius:99px;padding:10px 20px 10px 14px;
    font-weight:700;font-size:17px;
    animation:pop .4s cubic-bezier(.2,1.3,.4,1) both;
  }
  .who .dot{width:11px;height:11px;border-radius:50%;background:currentColor}
  .empty{color:var(--muted);font-size:16px;align-self:center}

  /* countdown */
  .count{font-family:var(--display);font-weight:900;font-size:clamp(120px,26vw,300px);
    line-height:1;text-align:center;letter-spacing:-.05em;
    animation:tick .9s cubic-bezier(.2,1.2,.3,1) both}
  @keyframes tick{from{opacity:0;transform:scale(.55)}60%{opacity:1}to{opacity:.15;transform:scale(1.25)}}

  /* question */
  .qhead{display:flex;align-items:baseline;gap:16px}
  .prompt{font-size:clamp(30px,4.4vw,50px);max-width:22ch}
  .qbubble{font-size:clamp(19px,2.2vw,27px);line-height:1.42;max-width:38ch}
  /* the presentation formats — shape is in app.css, size is here */
  .compare .side{flex:1 1 320px}
  .compare .qbubble{max-width:100%}
  .convo{max-width:44ch}
  .receipt{font-size:13px}
  /* Tall enough to read across a room, short enough to leave the prompt and
     the options on screen without scrolling. */
  .photo img{max-height:46vh}
  .photo .cap{max-width:38ch}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .opt{
    background:var(--raised);border-radius:18px;padding:22px 24px;
    font-size:clamp(18px,2vw,24px);font-weight:700;
    border:2px solid transparent;
  }
  .opt.emoji{font-size:44px;text-align:center}
  .opt.hit{border-color:var(--right);background:rgba(123,211,137,.1)}
  .opt.miss{opacity:.4}

  .waiting{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .tick{
    display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;
    padding:9px 17px;border-radius:99px;background:var(--raised);opacity:.4;
    transition:opacity .3s;
  }
  .tick.in{opacity:1}
  .tick .dot{width:10px;height:10px;border-radius:50%;
    background:transparent;border:2px solid currentColor;
    transition:background .3s ease}
  .tick.in .dot{background:currentColor}
  .tick .lab{display:inline-flex;gap:6px;align-items:baseline}
  .tick .took{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .tick .thinking{display:inline-flex;gap:4px;align-items:center;margin-left:2px}
  .tick .thinking i{width:5px;height:5px;border-radius:50%;background:currentColor;
    animation:blip 1.15s infinite ease-in-out both}
  .tick .thinking i:nth-child(2){animation-delay:.16s}
  .tick .thinking i:nth-child(3){animation-delay:.32s}

  /* reveal */
  .truth{border-left:3px solid var(--right);padding-left:20px;max-width:44ch}
  .truth .lab{font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .truth .val{font-size:clamp(20px,2.4vw,30px);line-height:1.34}

  .board{display:flex;flex-direction:column;gap:11px;max-width:640px;width:100%}
  .row{
    display:flex;align-items:center;gap:18px;
    background:var(--raised);border-radius:18px;padding:16px 22px;
    animation:slide .45s cubic-bezier(.2,1.1,.3,1) both;
  }
  @keyframes slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  .row .rank{font-family:var(--mono);font-size:14px;color:var(--muted);width:24px}
  .row .nm{flex:1;font-weight:700;font-size:21px}
  .row .delta{font-family:var(--mono);font-size:14px;font-weight:700;
    padding:3px 11px;border-radius:99px;background:var(--sunk)}
  .row .delta.good{color:var(--right)}
  .row .delta.zero{color:var(--wrong)}
  .row .tot{font-family:var(--mono);font-size:24px;font-weight:700;min-width:82px;text-align:right}
  .row .said{font-family:var(--mono);font-size:13px;color:var(--muted);max-width:16ch;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* podium */
  .podium{display:flex;gap:20px;align-items:flex-end;justify-content:center;min-height:320px}
  .plinth{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    min-width:190px;
    animation:rise .7s cubic-bezier(.2,1.1,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
  .plinth .nm{font-family:var(--display);font-weight:900;font-size:27px;letter-spacing:-.02em}
  .plinth .sc{font-family:var(--mono);font-weight:700;font-size:19px;color:var(--muted)}
  .plinth .block{
    width:100%;border-radius:20px 20px 0 0;background:var(--raised);
    display:flex;align-items:flex-start;justify-content:center;padding-top:16px;
    font-family:var(--mono);font-size:16px;color:var(--muted);
  }

  /* reveal choreography (DESIGN 2.5). The beat of silence before the answer
     resolves is the effect; everything here is a delay off that beat. */
  .opt.hit.lit{animation:lit .5s cubic-bezier(.2,1.1,.3,1) both}
  @keyframes lit{
    0%{border-color:var(--line);background:transparent}
    55%{border-color:var(--right);background:rgba(123,211,137,.26);transform:scale(1.035)}
    100%{border-color:var(--right);background:rgba(123,211,137,.1);transform:none}
  }
  .opt.miss.dim{animation:dim .45s ease both}
  @keyframes dim{from{opacity:1;transform:none}to{opacity:.4;transform:scale(.97)}}

  .truth.chor{animation:fadeup .5s ease both}
  @keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .typing{display:flex;gap:6px;align-items:center;height:34px}
  .typing i{
    width:8px;height:8px;border-radius:50%;background:var(--muted);
    animation:blip 1.15s infinite ease-in-out both;
  }
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes blip{0%,72%,100%{opacity:.25;transform:translateY(0)}
                  36%{opacity:1;transform:translateY(-4px)}}

  .row.chor{animation:slidein .45s cubic-bezier(.2,1.1,.3,1) both}
  @keyframes slidein{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
  .row .delta.pop{animation:pop .42s cubic-bezier(.2,1.4,.3,1) both}
  @keyframes pop{0%{opacity:0;transform:scale(.4)}60%{transform:scale(1.28)}
                 100%{opacity:1;transform:none}}
  .controls.chor{animation:fadeup .4s ease both}

  /* the tug of war (DESIGN 2.6). Two players is not a leaderboard, it is a
     rope — so draw the rope, and say the gap rather than two totals. */
  .tug{width:100%;max-width:640px;margin-top:4px}
  .tug .rope{
    position:relative;height:14px;border-radius:7px;overflow:hidden;
    background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);
  }
  .tug .rope span{
    position:absolute;top:0;bottom:0;left:0;
    transition:width .85s cubic-bezier(.3,1.2,.4,1);
  }
  .tug .rope u{
    position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--cream);
    transform:translateX(-1px);opacity:.75;
    transition:left .85s cubic-bezier(.3,1.2,.4,1);
  }
  .tug .gap{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:9px;font-size:15px;
  }
  .tug .gap b{font-family:var(--display);font-weight:900;font-size:19px}
  .tug.flip .rope u{animation:flash .7s ease 2}
  @keyframes flash{50%{opacity:.15;box-shadow:0 0 14px 5px var(--cream)}}

  /* the context thread (DESIGN 2.5 step 3). The actual conversation the
     answer sits in, which is the whole reason curate.py captures it. */
  .thread{display:flex;flex-direction:column;gap:7px;max-width:56ch;margin-top:18px}
  .thread .m{
    padding:9px 14px;border-radius:17px;font-size:16px;line-height:1.4;
    max-width:82%;background:var(--sunk);color:var(--muted);
    animation:msgin .4s cubic-bezier(.2,1.1,.3,1) both;
  }
  @keyframes msgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .thread .m.p1{align-self:flex-end;border-bottom-right-radius:5px}
  .thread .m.p2{align-self:flex-start;border-bottom-left-radius:5px}
  .thread .m.it{
    background:var(--raised);color:var(--cream);font-weight:500;
    box-shadow:0 0 0 1px var(--line);
  }

  /* the history shelf (DESIGN 2.1) */
  .shelf{margin-top:38px;width:100%;max-width:1040px;border-top:1px solid var(--line);
    padding-top:24px}
  .h2h{text-align:center;margin-bottom:18px}
  .tally{display:flex;align-items:baseline;justify-content:center;gap:16px;
    margin-top:8px}
  .tally .side{display:flex;align-items:baseline;gap:10px}
  .tally .nm{font-family:var(--display);font-weight:900;font-size:25px}
  .tally .n{font-family:var(--mono);font-weight:700;font-size:31px}
  .tally .dash{color:var(--muted);font-size:20px}
  .h2h .hint{margin-top:4px;font-size:13px}

  .cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .gcard{
    width:auto;min-width:150px;text-align:left;background:var(--raised);
    border:1px solid var(--line);border-radius:16px;padding:12px 14px;
    color:var(--cream);font:inherit;cursor:pointer;
    animation:rise .5s cubic-bezier(.2,1.1,.3,1) both;
    transition:transform .16s ease,border-color .16s ease;
  }
  .gcard:hover{transform:translateY(-3px);border-color:var(--muted)}
  .gcard .when{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted)}
  .gcard .sc{display:flex;gap:7px;align-items:baseline;margin-top:6px;
    font-family:var(--mono);font-weight:700;font-size:19px}
  .gcard .vs{color:var(--muted);font-weight:400}
  .gcard .won{font-size:14px;margin-top:5px}
  .gcard .aw{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic}
  .alltime{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}

  .roster .empty{display:flex;align-items:center;gap:8px}

  /* confetti, once (DESIGN 2.10). DOM nodes rather than a canvas: sixty divs
     for four seconds is cheaper than a render loop, and it dies on its own. */
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
  .confetti i{
    position:absolute;top:-24px;width:9px;height:14px;border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    from{transform:translateY(-10vh) rotate(0deg);opacity:1}
    to{transform:translateY(110vh) rotate(720deg);opacity:.85}
  }
  .crown{font-size:26px;line-height:1}

  /* the receipts reel (DESIGN 2.11) — the game, with the game removed */
  .reel{
    position:fixed;inset:0;background:var(--night);z-index:40;
    overflow-y:auto;padding:38px 30px 90px;
    animation:reelin .45s cubic-bezier(.2,1,.3,1) both;
  }
  @keyframes reelin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .reel .inner{max-width:720px;margin:0 auto}
  .reel h2{font-family:var(--display);font-weight:900;font-size:40px;
    letter-spacing:-.02em;margin-bottom:6px}
  .reel .sub{color:var(--muted);font-size:15px;margin-bottom:34px}
  .rnd{padding:24px 0;border-top:1px solid var(--line)}
  .rnd .no{font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted)}
  .rnd .q{font-family:var(--display);font-weight:600;font-size:22px;
    line-height:1.25;margin:8px 0 14px}
  .rnd .msg{
    background:var(--raised);border-radius:20px 20px 20px 5px;
    padding:13px 17px;font-size:17px;line-height:1.45;max-width:85%;
  }
  .rnd .said{font-family:var(--mono);font-size:12px;color:var(--muted);
    margin-top:10px}
  .rnd .tru{border-left:3px solid var(--right);padding-left:16px;margin-top:14px;
    font-size:16px;line-height:1.4}
  /* appended to <body>, not inside .reel — so it cannot be `.reel .close` */
  .reel-close{
    position:fixed;top:20px;right:24px;width:auto;min-width:0;padding:10px 18px;
    z-index:41;
  }

  /* the score graph (DESIGN 2.8). Raw SVG — a charting library for two
     polylines is payload nobody asked for. */
  .graph{margin-top:30px;width:100%;max-width:960px}
  .graph svg{width:100%;height:auto;display:block;overflow:visible}
  .graph .gl{stroke:var(--line);stroke-width:1}
  .graph path.ln{
    fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    animation:draw 1.25s cubic-bezier(.4,0,.2,1) both;
  }
  @keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  .graph .lead{animation:pip .4s cubic-bezier(.2,1.4,.3,1) both}
  @keyframes pip{from{opacity:0;r:0}to{opacity:1}}
  .graph text{font-family:var(--mono);font-size:13px;fill:var(--muted)}
  .graph text.end{font-size:15px;font-weight:700}
  .graph text.note{font-size:12px;fill:var(--cream)}
  .graph .fade{animation:fadeup .5s ease both}

  /* superlatives — dealt one at a time, ~2s apart (DESIGN 2.9) */
  .awards{margin-top:34px;width:100%;max-width:960px}
  .awards .eyebrow{text-align:center;margin-bottom:14px}
  .awardrow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .award{
    flex:0 1 300px;background:var(--raised);border-radius:18px;padding:16px 18px;
    border-left:4px solid var(--muted);text-align:left;
  }
  .award.dealing{animation:deal .6s cubic-bezier(.2,1.1,.3,1) both}
  @keyframes deal{
    from{opacity:0;transform:translateY(26px) rotate(-2deg) scale(.94)}
    to{opacity:1;transform:none}
  }
  .award .ttl{font-family:var(--display);font-weight:900;font-size:21px;
    letter-spacing:-.01em;margin-bottom:4px}
  .award .ev{font-size:14px;color:var(--muted);line-height:1.45}

  .mute{
    width:auto;min-width:0;padding:6px 10px;font-size:17px;line-height:1;
    background:transparent;border:1px solid var(--line);border-radius:10px;
    cursor:pointer;
  }
  .mute:hover{border-color:var(--muted)}

  .controls{display:flex;gap:14px;align-items:center}
  .controls button{width:auto;min-width:190px}
  .hint{color:var(--muted);font-size:14px}

  @media (max-width:860px){
    #host{padding:22px}
    .lobby{grid-template-columns:1fr;gap:28px}
    .opts{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="host"></div>

<script src="/static/shared.js"></script>
<script src="/static/sound.js"></script>
<script>
const view = document.getElementById("host");
let S = null, lastPhase = null, timerRaf = null;

/* ------------------------------------------------------------------ chrome */

function topbar() {
  const bar = h("div", "topbar");
  bar.append(h("div", "mark", "Read Receipts"));
  if (S.phase !== "lobby" && S.phase !== "final") {
    bar.append(h("div", "pill", `Round ${S.round + 1} / ${S.rounds}`));
  }
  const sp = h("div", "spacer"); bar.append(sp);

  /* Visible mute. Non-negotiable if she's on a call with you while playing
     (DESIGN §6). */
  const mute = h("button", "mute", Sound.muted ? "🔇" : "🔊");
  mute.title = Sound.muted ? "Sound off" : "Sound on";
  mute.setAttribute("aria-label", mute.title);
  mute.onclick = () => {
    const off = Sound.toggle();
    mute.textContent = off ? "🔇" : "🔊";
    mute.title = off ? "Sound off" : "Sound on";
    mute.setAttribute("aria-label", mute.title);
    /* Unmuting is a gesture, so it is also the earliest moment the bed for
       whatever is already on screen is allowed to start. */
    if (!off && S) cue(S, true);
  };
  bar.append(mute);
  S.players.forEach(p => {
    const chip = h("div", "pill");
    chip.style.color = p.color;
    chip.textContent = `${p.name} ${p.score}`;
    bar.append(chip);
  });
  return bar;
}

function main(...kids) {
  const m = h("div", "main fade");
  m.append(...kids.filter(Boolean));
  return m;
}

/* ------------------------------------------------------------------ views  */

/* ── the opener ─────────────────────────────────────────────────────────────
 *
 * Five years of the thread, drawn once, on the lobby screen. `meta.density`
 * is already a message count per month — the same array the phone draws
 * behind the month slider — so this costs no new data and no request.
 *
 * It fills left to right over ~14 seconds while the room settles, with the
 * month label and a running total climbing underneath. The point is that she
 * watches the quiet first year, then the month it goes vertical, and knows
 * exactly what that spike was before a single question is asked.
 *
 * Runs once per page load. A re-render while people join must not restart it,
 * so the finished bars are cached and re-attached rather than rebuilt.
 */
let openerEl = null;

function opener() {
  if (openerEl) return openerEl;                 // already ran; don't replay

  const d = S.meta && S.meta.density;
  const months = S.meta && S.meta.months;
  if (!Array.isArray(d) || !Array.isArray(months) || d.length !== months.length
      || d.length < 12) return null;

  const wrap = h("div", "opener");
  const chart = h("div", "opener-bars");
  const peak = Math.max(...d, 1);
  const bars = d.map((v, i) => {
    const b = h("b");
    /* sqrt, like the phone's histogram: one frantic month would otherwise
       flatten five years into a spike and a floor. */
    b.dataset.h = Math.max(2, Math.round(Math.sqrt(v / peak) * 100));
    b.style.left = (i / (d.length - 1)) * 100 + "%";
    b.style.width = "calc(" + (100 / d.length) + "% - 2px)";
    chart.append(b);
    return b;
  });

  const foot = h("div", "opener-foot");
  const when = h("span", "opener-when", monthLabel(months[0]));
  const tally = h("span", "opener-tally", "0");
  foot.append(when, tally);
  wrap.append(chart, foot);

  /* One rAF loop rather than a transition per bar: 60 staggered CSS
     transitions on a TV browser is where this would start dropping frames. */
  const DUR = 14000;
  let running = 0;
  const totals = d.map(v => (running += v));
  const start = performance.now();
  (function step(now) {
    const t = Math.min(1, (now - start) / DUR);
    /* ease-out: the early months are nearly empty and would otherwise crawl */
    const e = 1 - Math.pow(1 - t, 2);
    const upto = e * (d.length - 1);
    bars.forEach((b, i) => {
      const on = i <= upto;
      b.style.height = (on ? b.dataset.h : 0) + "%";
      b.classList.toggle("lit", on);
    });
    const ix = Math.min(d.length - 1, Math.round(upto));
    when.textContent = monthLabel(months[ix]);
    tally.textContent = Math.round(totals[ix]).toLocaleString();
    if (t < 1) requestAnimationFrame(step);
    else {
      when.textContent = S.meta.first + " — " + S.meta.last;
      tally.textContent = (S.meta.total || totals[totals.length - 1]).toLocaleString()
        + " messages";
    }
  })(start);

  openerEl = wrap;
  return wrap;
}

function lobby() {
  const left = h("div", "stack");
  const title = h("h1", "display");
  title.append(document.createTextNode("Read"), h("br"),
               document.createTextNode("Receipts"));
  title.append(h("span", "thin", "how well do you remember us?"));

  const sub = h("p");
  sub.style.cssText = "color:var(--muted);font-size:19px;margin-top:26px;max-width:32ch";
  sub.textContent = S.meta.total
    ? `${S.meta.total.toLocaleString()} messages, ${S.meta.first} to ${S.meta.last}. `
      + `${S.rounds} rounds. Fastest right answer takes it.`
    : `${S.rounds} rounds. Fastest right answer takes it.`;

  const roster = h("div", "roster");
  roster.style.marginTop = "30px";
  if (!S.players.length) {
    const w = h("div", "empty");
    const dots = h("span", "thinking");
    dots.append(h("i"), h("i"), h("i"));
    w.append(textNode("Waiting for phones", "var(--muted)"), dots);
    roster.append(w);
  }
  S.players.forEach(p => {
    const w = h("div", "who");
    w.style.color = p.color;
    w.append(h("span", "dot"), textNode(p.name, "var(--cream)"));
    roster.append(w);
  });

  const start = h("button", "cta", S.players.length ? "Start the game"
                                                    : "Waiting for players…");
  start.disabled = !S.players.length;
  start.onclick = () => { Sound.init(); send({ t: "start" }); };
  /* Browsers refuse audio before a gesture, so the lobby bed cannot start on
     load. The mute button is the other gesture that unlocks it, and it is
     the one that is there before anyone has pressed Start. */
  const startWrap = h("div", "controls");
  startWrap.style.marginTop = "26px";
  startWrap.append(start);

  left.append(title, sub);
  const arc = opener();
  if (arc) left.append(arc);
  left.append(roster, startWrap);

  const box = h("div", "joinbox");
  box.append(h("div", "eyebrow", "Join from your phone"));
  const img = document.createElement("img");
  img.src = "/qr.svg?base=" + encodeURIComponent(location.origin);
  img.alt = "QR code to join";
  img.style.cssText = "width:180px;height:180px";
  box.append(img, h("div", "url", location.origin + "/play"));

  /* The QR already carries the code. This is for the phone that won't scan,
     which on a sofa at night is most of them. */
  if (S.code) {
    const c = h("div", "codebox");
    c.append(h("div", "eyebrow", "or enter the code"),
             h("div", "code", S.code));
    box.append(c);
  }

  if (S.datasets && S.datasets.options.length > 1) box.append(datasetToggle());

  const wrap = h("div", "lobby");
  wrap.append(left, box);
  return main(wrap, shelf());
}

/* "Previously on Read Receipts" (DESIGN 2.1). Five years of meetaversaries
   and this shelf is the actual artifact. Empty until a game has been played
   — and, for the real dataset, until the passphrase has been typed, because
   every line of that log is ciphertext until then (history.py). */
function shelf() {
  const hist = S.history;
  if (!hist || !hist.games.length) return null;
  const st = hist.stats || {};

  const box = h("div", "shelf");

  if (st.record && st.record.length > 1) {
    const hh = h("div", "h2h");
    hh.append(h("div", "eyebrow", "head to head"));
    const line = h("div", "tally");
    st.record.forEach((r, i) => {
      if (i) line.append(h("span", "dash", "—"));
      const who = h("span", "side");
      const n = h("span", "n", String(r.wins));
      n.style.color = (S.players.find(p => p.id === r.pid) || {}).color
                      || "var(--cream)";
      /* Name first on the left, score first on the right, so the two numbers
         meet in the middle either side of the dash. */
      who.append(...(i ? [n, h("span", "nm", r.name)]
                       : [h("span", "nm", r.name), n]));
      line.append(who);
    });
    hh.append(line);
    if (st.draws) hh.append(h("div", "hint", st.draws === 1 ? "one draw"
                                                            : `${st.draws} draws`));
    box.append(hh);
  }

  const row = h("div", "cards");
  hist.games.slice(0, 6).forEach((g, i) => {
    const card = h("button", "gcard");
    card.style.animationDelay = (i * 0.07) + "s";
    const when = new Date(g.played_at);
    card.append(h("div", "when", when.toLocaleDateString([],
                  { month: "short", day: "numeric" })));

    const line = h("div", "sc");
    const ids = Object.keys(g.scores);
    ids.forEach((pid, k) => {
      if (k) line.append(h("span", "vs", "–"));
      const n = h("span", "v", g.scores[pid].toLocaleString());
      if (g.colors && g.colors[pid]) n.style.color = g.colors[pid];
      line.append(n);
    });
    card.append(line);

    card.append(h("div", "won", g.winner ? `${g.names[g.winner]} 👑` : "a draw"));
    if (g.awards && g.awards.length) {
      card.append(h("div", "aw", "“" + g.awards[0] + "”"));
    }
    card.onclick = () => openReel(g.id);
    row.append(card);
  });
  box.append(row);

  const bits = [];
  if (st.best_round) {
    bits.push(`biggest round ${st.best_round.points.toLocaleString()} — ` +
              `${st.best_round.name} on “${st.best_round.kind}”`);
  }
  (st.repeats || []).forEach(r =>
    bits.push(`${r.name} has been ${r.title} ${r.times}×`));
  if (st.questions_seen) bits.push(`${st.questions_seen} questions seen`);
  if (bits.length) box.append(h("div", "alltime", bits.join("  ·  ")));

  return box;
}

/* The real thread is ciphertext until somebody types the words. Nothing on
   this server can open it on its own — see app/datasets.py. */
function datasetToggle() {
  const d = S.datasets;
  const box = h("div", "dsbox");
  box.append(h("div", "eyebrow", "playing"));

  const row = h("div", "dsrow");
  d.options.forEach(o => {
    const b = h("button", "ds" + (o.id === d.current ? " on" : ""),
                o.label + (o.locked && !o.ready ? " 🔒" : ""));
    b.onclick = () => {
      if (o.id === d.current) return;
      if (o.locked && !o.ready) return askPass(o.id);
      send({ t: "dataset", id: o.id });
    };
    row.append(b);
  });
  box.append(row);
  if (dsError) box.append(h("div", "dserr", dsError));
  return box;
}

let dsError = "";

function askPass(id) {
  const veil = h("div", "veil");
  const sheet = h("div", "sheet");
  sheet.append(h("div", "eyebrow", "passphrase"));
  const p = document.createElement("input");
  p.type = "password";
  p.autocomplete = "off";
  p.placeholder = "the words";
  const go = h("button", "cta", "Unlock");
  const note = h("div", "dsnote",
    "Typed once a night. The server keeps no key — close it and it's ciphertext again.");
  const done = () => veil.remove();
  go.onclick = () => {
    if (!p.value) return;
    dsError = "";
    send({ t: "dataset", id, pass: p.value });
    p.value = "";
    done();
  };
  p.onkeydown = e => { if (e.key === "Enter") go.click(); };
  veil.onclick = e => { if (e.target === veil) done(); };
  sheet.append(p, go, note);
  veil.append(sheet);
  document.body.append(veil);
  setTimeout(() => p.focus(), 60);
}

function countdown() {
  const left = Math.max(1, Math.ceil(3 - (serverNow() - S.now)));
  const n = h("div", "count", String(left));
  setTimeout(render, 900);
  return main(n);
}

/* What a player said, plus what they put on it. The stake is only interesting
   on the Final Receipt, and it is the most interesting thing there. */
function saidWith(q, last) {
  const said = shownGuess(q, last.answer, S);
  if (q.type !== "wager") return said;
  return said + (last.stake ? "  ·  " + last.stake.toLocaleString() : "  ·  nothing");
}

/* The option every player picked, or null if they split or someone sat out.
   Only meaningful for `mutual`. */
function agreedOption() {
  const said = S.players.map(p => (p.last ? p.last.answer : null));
  if (!said.length || said.some(a => a === null || a === undefined)) return null;
  return said.every(a => a === said[0]) ? said[0] : null;
}

function question(revealed) {
  const q = S.question;
  const rows = [];

  const head = h("div", "qhead");
  head.append(h("div", "eyebrow", q.kind));
  rows.push(head);
  rows.push(h("h2", "prompt serif", q.prompt));
  /* At the reveal the context thread carries this same message, highlighted
     in place — showing it twice reads as a repeat rather than as "and here is
     where it was". A photograph is never in that thread, so it is never the
     thing being repeated; this used to test `q.text`, which meant a photo with
     no caption rendered nothing at all on the big screen. */
  const inThread = revealed && q.context && q.context.length > 1;
  if (!(inThread && q.text && q.format !== "photo")) {
    /* `format` decides the shape — inked slots, two sides, a conversation, a
       receipt with a clock, a picture. shared.js/messageBlock is the only
       reader, and it returns null when there is nothing to draw. */
    const b = messageBlock(q, "bubble qbubble");
    if (b) rows.push(b);
  }

  if (q.options) {
    const grid = h("div", "opts");
    const isEmoji = q.options.every(o => o.length <= 3 && !/[a-z0-9]/i.test(o));
    /* Mutual has no correct answer, so there is nothing to light up unless the
       two of them landed on the same tile — which is the whole result of the
       round, and worth showing as one. Disagree and nothing is dimmed: neither
       of them was wrong. */
    const hit = q.type === "mutual" ? agreedOption() : q.answer;
    q.options.forEach((opt, i) => {
      const cell = h("div", "opt" + (isEmoji ? " emoji" : ""), opt);
      if (revealed && hit !== null) cell.classList.add(i === hit ? "hit" : "miss");
      grid.append(cell);
    });
    rows.push(grid);
  } else if (!revealed) {
    rows.push(h("div", "hint",
      q.type === "number" ? "Type your number on your phone."
      : q.type === "percent" ? "Slide to a percentage on your phone."
                          : "Slide to a month on your phone."));
  }

  if (q.type === "mutual" && !revealed) {
    rows.push(h("div", "hint", "No right answer. You score by agreeing."));
  }
  if (q.type === "wager" && !revealed) {
    rows.push(h("div", "hint", "Stake first, then answer. Win it or lose it."));
  }

  if (!revealed) {
    const bar = h("div", "timer");
    const fill = h("span");
    bar.append(fill);
    rows.push(bar);
    animateTimer(bar, fill);

    const wait = h("div", "waiting");
    wait.append(...S.players.map(tickFor));
    rows.push(wait);
  }

  return main(...rows);
}

/* Two players is a rope, not a ladder (DESIGN 2.6). One bar, a centre line
   that slides, and the gap said out loud — "Nilu leads by 340" is a sentence;
   two totals are a table. `lastLeader` gives the line a flash on the round
   the rope actually changes hands. */
let lastLeader = null;

function tugOfWar(fresh) {
  const ps = S.players;
  if (ps.length !== 2) return null;
  const [a, b] = ps;                                 // already sorted by score
  const total = a.score + b.score;
  /* Level, or nobody has scored: the line sits in the middle rather than
     jumping to one end on a divide by zero. */
  const share = total > 0 ? a.score / total : 0.5;
  const gap = a.score - b.score;

  const box = h("div", "tug");
  const rope = h("div", "rope");
  const fill = h("span");
  fill.style.width = (share * 100) + "%";
  fill.style.background = a.color;
  const rest = h("span");
  rest.style.cssText = `left:${share * 100}%;right:0;width:${(1 - share) * 100}%`;
  rest.style.background = b.color;
  const line = h("u");
  line.style.left = (share * 100) + "%";
  rope.append(fill, rest, line);

  const gapLine = h("div", "gap");
  const left = h("div");
  left.append(textNode(a.name, a.color, "nm"));
  const right = h("div");
  right.append(textNode(b.name, b.color, "nm"));
  const mid = h("b");
  mid.textContent = gap === 0 ? "level"
                              : `${a.name} leads by ${gap.toLocaleString()}`;
  gapLine.append(left, mid, right);

  const leader = gap === 0 ? null : a.id;
  if (fresh && leader && lastLeader && leader !== lastLeader) box.classList.add("flip");
  if (fresh) lastLeader = leader;

  box.append(rope, gapLine);
  return box;
}

/* The messages either side of the one the question came from, as a small
   thread with the source lit. This is the difference between "the answer was
   pasta" and the actual evening in May 2023 when you said it. Only curated
   and message-sourced questions have one; a counting question has no
   conversation to show and gets nothing. */
function thread(msgs, fresh) {
  if (!Array.isArray(msgs) || msgs.length < 2) return null;
  const box = h("div", "thread");
  msgs.forEach((m, i) => {
    const b = h("div", "m " + (m.who === "p1" ? "p1" : "p2") + (m.self ? " it" : ""));
    b.textContent = m.text;
    if (fresh) b.style.animationDelay = (BEAT.thread + i * 0.09) + "s";
    else b.style.animation = "none";
    box.append(b);
  });
  return box;
}

/* Rounds whose reveal has already been choreographed. A phone dropping off
   mid-reveal triggers a re-render, and replaying the whole sequence from the
   silence would be worse than not having one. */
const played = new Set();

/* The beats, in seconds from the moment the reveal lands (DESIGN 2.5). */
const BEAT = { resolve: 0.45, thread: 0.9, typing: 1.9, truth: 2.8,
               board: 3.2, controls: 3.8 };

function reveal() {
  const q = S.question;
  const fresh = !played.has(S.round);
  played.add(S.round);
  const at = k => (fresh ? BEAT[k] : 0) + "s";

  const rows = [question(true)];
  if (fresh) {
    /* 1. the room goes quiet, then 2. the answer resolves and the wrong
       tiles desaturate. Silence is the effect, so it is a real delay. */
    rows[0].querySelectorAll(".opt.hit").forEach(c => {
      c.classList.add("lit"); c.style.animationDelay = at("resolve");
    });
    rows[0].querySelectorAll(".opt.miss").forEach(c => {
      c.classList.add("dim"); c.style.animationDelay = at("resolve");
    });
  }

  const ctx = thread(q.context, fresh);
  if (ctx) rows[0].append(ctx);

  const truth = h("div", "truth" + (fresh ? " chor" : ""));
  truth.style.animationDelay = at("typing");
  const val = h("div", "val");
  truth.append(h("div", "lab",
                 q.type === "mutual" ? "No right answer" : "The truth"), val);
  if (fresh) {
    /* 4. the typing indicator first, then the line lands. */
    const dots = h("div", "typing");
    dots.append(h("i"), h("i"), h("i"));
    val.append(dots);
    setTimeout(() => {
      if (val.isConnected) val.replaceChildren(document.createTextNode(q.reveal));
    }, BEAT.truth * 1000);
  } else {
    val.textContent = q.reveal;
  }

  const tug = tugOfWar(fresh);

  const board = h("div", "board");
  S.players.forEach((p, i) => {
    const row = h("div", "row" + (fresh ? " chor" : ""));
    row.style.animationDelay = ((fresh ? BEAT.board : 0) + i * 0.12) + "s";
    row.style.color = p.color;
    const pts = p.last ? p.last.points : 0;
    /* 5. the points arrive after the row does, not with it. A lost wager is
       the only negative in the game, and "+-800" is not a number. */
    const delta = h("div", "delta " + (pts > 0 ? "good" : "zero") +
                            (fresh ? " pop" : ""),
                    (pts < 0 ? "−" : "+") + Math.abs(pts).toLocaleString());
    delta.style.animationDelay = ((fresh ? BEAT.board : 0) + i * 0.12 + 0.3) + "s";
    row.append(
      h("div", "rank", "#" + (i + 1)),
      textNode(p.name, "var(--cream)", "nm"),
      h("div", "said", p.last ? saidWith(q, p.last) : "—"),
      delta,
      h("div", "tot", String(p.score))
    );
    board.append(row);
  });

  const last = S.round + 1 >= S.rounds;
  const next = h("button", "cta", last ? "Final scores" : "Next round");
  next.onclick = () => send({ t: "next" });
  const controls = h("div", "controls" + (fresh ? " chor" : ""));
  controls.style.animationDelay = at("controls");
  controls.append(next);

  const m = main(truth, tug, board, controls);
  rows[0].append(...m.childNodes);
  return rows[0];
}

/* ------------------------------------------------------------------ reel  */

/* The receipts reel: every round of a past game, scrollable, with the scoring
   stripped out (DESIGN 2.11). The mechanic was always a pretext for showing
   her messages she had forgotten about — this is that, with the game removed.
   It sits over whatever screen you opened it from, so the lobby keeps its
   sockets and the podium keeps its confetti. */
let reel = null;

function openReel(id) {
  send({ t: "reel", id });
}

function onReel(game) {
  reel = game;
  drawReel();
}

function closeReel() {
  reel = null;
  closeReelDom();
  document.removeEventListener("keydown", reelKeys);
}

function reelKeys(e) {
  if (e.key === "Escape") closeReel();
}

function drawReel() {
  closeReelDom();
  const g = reel;
  if (!g) return;

  const box = h("div", "reel");
  const inner = h("div", "inner");

  const when = new Date(g.played_at);
  inner.append(h("h2", null, "The receipts"));
  const who = Object.keys(g.scores || {})
    .map(pid => `${g.names[pid]} ${g.scores[pid].toLocaleString()}`).join("  ·  ");
  inner.append(h("div", "sub",
    when.toLocaleDateString([], { month: "long", day: "numeric", year: "numeric" })
    + (who ? "  ·  " + who : "")));

  (g.rounds || []).forEach((r, i) => {
    const row = h("div", "rnd");
    row.append(h("div", "no", `${i + 1} · ${r.kind}`));
    row.append(h("div", "q", r.prompt));
    /* Same rule as the reveal: when the thread carries this message in place,
       showing it above as well reads as a repeat. */
    const ctx = thread(r.context, false);
    if (r.text && !ctx) row.append(h("div", "msg", r.text));
    if (ctx) row.append(ctx);
    /* Who said what, but never who won it. The scoring is the part we are
       deliberately leaving behind. */
    const guesses = Object.entries(r.results || {})
      .map(([pid, res]) => `${g.names[pid] || pid} said ${reelGuess(r, res.answer, g)}`)
      .join("   ·   ");
    if (guesses) row.append(h("div", "said", guesses));
    if (r.reveal) row.append(h("div", "tru", r.reveal));
    inner.append(row);
  });

  box.append(inner);
  const close = h("button", "ghost close reel-close", "Close");
  close.onclick = closeReel;
  document.body.append(box, close);
  document.addEventListener("keydown", reelKeys);
  box.scrollTop = 0;
}

function closeReelDom() {
  const el = document.querySelector(".reel");
  if (el) el.remove();
  const btn = document.querySelector(".reel-close");
  if (btn) btn.remove();
}

/* The reel has no live `S.question`, so shownGuess's month lookup needs the
   months from the game being replayed rather than from the current one. */
function reelGuess(r, answer, g) {
  if (answer === null || answer === undefined) return "nothing";
  if (r.options && r.options[answer] !== undefined) return "“" + r.options[answer] + "”";
  if (r.type === "number") return Number(answer).toLocaleString();
  if (r.type === "percent") return answer + "%";
  if (r.type === "month" && S.meta && S.meta.months && S.meta.months[answer]) {
    return monthLabel(S.meta.months[answer]);
  }
  return String(answer);
}

/* ------------------------------------------------------------ score graph */

const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* Two lines, one per player, the rounds across the bottom. Lead changes get a
   pip; the biggest single round of the night gets a label. The whole thing is
   the "cool history of the game" in one image, and the thing worth
   screenshotting (DESIGN 2.8). */
function scoreGraph() {
  const c = S.curve;
  if (!c || c.rounds < 2 || !c.lines.length) return null;

  const W = 900, H = 280, L = 10, R = 104, T = 22, B = 30;
  const top = Math.max(c.high, 1) * 1.1;
  const x = i => L + (i / (c.rounds - 1)) * (W - L - R);
  const y = v => T + (1 - v / top) * (H - T - B);
  const colour = pid => (S.players.find(p => p.id === pid) || {}).color
                        || "var(--muted)";

  const g = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
                        "aria-label": "Score by round" });

  // a few horizontal rules, enough to read height by and no more
  for (let k = 0; k <= 3; k++) {
    const v = (top / 3) * k;
    g.append(sv("line", { class: "gl", x1: L, x2: W - R, y1: y(v), y2: y(v) }));
  }

  // round numbers: first, last, and the quarters — 14 labels is noise
  for (let i = 0; i < c.rounds; i++) {
    if (i !== 0 && i !== c.rounds - 1 && i % Math.ceil(c.rounds / 5)) continue;
    const t = sv("text", { x: x(i), y: H - 8, "text-anchor": "middle" });
    t.textContent = i + 1;
    g.append(t);
  }

  c.lines.forEach((ln, k) => {
    const pts = ln.points.map((v, i) => [x(i), y(v)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " +
                                p[1].toFixed(1)).join(" ");
    const path = sv("path", { class: "ln", d, stroke: colour(ln.pid) });
    /* Rough is fine: the dash only has to be longer than the path for the
       draw-on to start off screen. */
    const len = Math.round(W * 1.6);
    path.style.setProperty("--len", len);
    path.style.strokeDasharray = len;
    path.style.animationDelay = (0.25 + k * 0.18) + "s";
    g.append(path);

    const last = pts[pts.length - 1];
    const name = sv("text", { class: "end fade", x: last[0] + 12,
                              y: last[1] - 4, fill: colour(ln.pid) });
    name.textContent = ln.name;
    const score = sv("text", { class: "fade", x: last[0] + 12, y: last[1] + 14 });
    score.textContent = ln.points[ln.points.length - 1].toLocaleString();
    for (const el of [name, score]) el.style.animationDelay = "1.5s";
    g.append(name, score);
  });

  // where the game turned over
  c.leads.forEach((i, k) => {
    const ln = c.lines.find(l => {
      const best = Math.max(...c.lines.map(z => z.points[i]));
      return l.points[i] === best;
    });
    if (!ln) return;
    const dot = sv("circle", { class: "lead", cx: x(i), cy: y(ln.points[i]),
                               r: 6, fill: "var(--night)",
                               stroke: colour(ln.pid), "stroke-width": 3 });
    dot.style.animationDelay = (1.5 + k * 0.12) + "s";
    g.append(dot);
  });

  // the biggest single round of the night
  if (c.best && c.best.points > 0 && c.rounds > 2) {
    const ln = c.lines.find(l => l.pid === c.best.pid);
    if (ln) {
      const i = c.best.round;
      const up = y(ln.points[i]) > 60;
      const note = sv("text", { class: "note fade", x: x(i),
                                y: y(ln.points[i]) + (up ? -16 : 26),
                                "text-anchor": "middle" });
      note.textContent = `+${c.best.points.toLocaleString()}`;
      note.style.animationDelay = "1.7s";
      g.append(note);
    }
  }

  const box = h("div", "graph");
  box.append(h("div", "eyebrow", "how it went"), g);
  return box;
}

/* The awards land after the podium, one every couple of seconds. `dealt`
   survives re-renders so a phone dropping off mid-ceremony doesn't restart
   the whole run — a card that has already landed stays landed. */
const dealt = new Set();

function awardCards() {
  const list = (S.awards || []);
  if (!list.length) return null;

  const box = h("div", "awards");
  box.append(h("div", "eyebrow", list.length === 1 ? "one award" : "the awards"));
  const row = h("div", "awardrow");

  list.forEach((a, i) => {
    const card = h("div", "award");
    const who = a.winners
      .map(id => (S.players.find(p => p.id === id) || {}).color)
      .filter(Boolean);
    card.style.borderLeftColor = who[0] || "var(--muted)";

    if (!dealt.has(a.key)) {
      card.classList.add("dealing");
      card.style.animationDelay = (0.6 + i * 2) + "s";
      setTimeout(() => { dealt.add(a.key); Sound.ping(); }, 600 + i * 2000);
    }
    card.append(h("div", "ttl", a.title), h("div", "ev", a.evidence));
    row.append(card);
  });

  box.append(row);
  return box;
}

/* One burst, on arrival at the podium. `once` because a re-render — a phone
   dropping off, a late reconnect — must not set it off again. */
let confettiFired = false;

function confetti(colors) {
  if (confettiFired) return;
  confettiFired = true;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const box = h("div", "confetti");
  for (let i = 0; i < 70; i++) {
    const bit = h("i");
    bit.style.left = Math.random() * 100 + "vw";
    bit.style.background = colors[i % colors.length];
    bit.style.animationDuration = (2.4 + Math.random() * 1.8) + "s";
    bit.style.animationDelay = (Math.random() * 0.8) + "s";
    bit.style.opacity = 0.55 + Math.random() * 0.45;
    box.append(bit);
  }
  document.body.append(box);
  setTimeout(() => box.remove(), 5200);
}

function final() {
  const order = S.players.slice();
  const top = order[0] ? order[0].score : 0;
  const tie = order.length > 1 && order[0].score === order[1].score;

  const head = h("h1", "display");
  head.style.fontSize = "clamp(46px,7vw,84px)";
  head.textContent = tie ? "A dead heat." : `${order[0] ? order[0].name : "Nobody"} wins.`;

  const podium = h("div", "podium");
  const heights = [230, 165, 120, 95];
  order.slice(0, 4).forEach((p, i) => {
    const col = h("div", "plinth");
    col.style.animationDelay = (i * 0.14) + "s";
    col.style.color = p.color;
    const nm = h("div", "nm", p.name);
    if (i === 0 && !tie) {
      const crown = h("span", "crown", " 👑");
      crown.setAttribute("aria-label", "winner");
      nm.append(crown);
    }
    col.append(nm, h("div", "sc", p.score.toLocaleString()));
    const block = h("div", "block", "#" + (i + 1));
    block.style.height = heights[i] + "px";
    block.style.background = `linear-gradient(180deg,${p.color}33,var(--raised))`;
    col.append(block);
    podium.append(col);
  });

  const sub = h("p", "hint",
    `${top.toLocaleString()} out of ${(S.rounds * 1000).toLocaleString()} possible.`);

  const again = h("button", "ghost", "Back to the lobby");
  again.onclick = () => send({ t: "reset" });
  const controls = h("div", "controls");
  if (S.game_id) {
    const replay = h("button", "cta", "Replay the receipts");
    replay.onclick = () => openReel(S.game_id);
    controls.append(replay);
  }
  controls.append(again);

  confetti(order.map(p => p.color).concat(["#EFE7DE"]));
  return main(head, sub, podium, scoreGraph(), awardCards(), controls);
}

/* ------------------------------------------------------------------ timer  */

function animateTimer(bar, fill) {
  cancelAnimationFrame(timerRaf);
  const total = S.seconds * 1000;
  const step = () => {
    const left = Math.max(0, (S.endsAt - serverNow()) * 1000);
    fill.style.transform = `scaleX(${left / total})`;
    bar.classList.toggle("urgent", left < total * 0.28);
    tickClock(left);
    if (left > 0 && document.body.contains(bar)) timerRaf = requestAnimationFrame(step);
  };
  step();
}

/* ----------------------------------------------------------------- render  */

function render() {
  if (!S) return;
  view.replaceChildren();
  view.append(topbar());
  if (S.phase === "lobby") view.append(lobby());
  else if (S.phase === "countdown") view.append(countdown());
  else if (S.phase === "question") view.append(question(false));
  else if (S.phase === "reveal") view.append(reveal());
  else if (S.phase === "final") view.append(final());
}

function onDenied(why) {
  dsError = why === "could not open" ? "That didn't open it." : why;
  render();
}

/* Browsers will not make a sound until the page has been interacted with, and
   the lobby — which is exactly where the bed matters, while two people settle
   down — gets no interaction at all until someone presses Start. So the first
   gesture of any kind unlocks the audio context and starts whatever bed the
   current phase asks for. Once only; it removes itself.
 *
 * `Sound.init()` on its own is not enough on iOS Safari, where a context
 * created before a gesture is born suspended — hence the explicit resume. */
function unlockAudio() {
  const ctx = Sound.init();
  if (ctx && ctx.state === "suspended") ctx.resume();
  if (S) cue(S, true);
}
["pointerdown", "keydown"].forEach(ev =>
  window.addEventListener(ev, unlockAudio, { once: true, capture: true }));

connect("host", s => {
  const phaseChanged = !S || S.phase !== s.phase || S.round !== s.round;
  /* Back in the lobby means a new game: forget which reveals and which award
     cards have already had their moment. */
  if (s.phase === "lobby") {
    played.clear(); dealt.clear(); confettiFired = false; lastLeader = null;
  }
  cue(s, phaseChanged);
  S = s;
  if (phaseChanged || s.phase !== "question") render();
  else refreshTicks();
});

/* The soundtrack rides the state transitions rather than the render, so a
   re-render never replays a cue (DESIGN §6). */
let ticked = -1;
function cue(next, phaseChanged) {
  // someone locked in
  if (S && next.answered.length > S.answered.length && next.phase === "question") {
    Sound.send();
  }
  if (!phaseChanged) return;

  if (next.phase === "question") ticked = -1;
  // the receive lands *after* the silence — the pause is the joke
  if (next.phase === "reveal") setTimeout(() => Sound.receive(), BEAT.resolve * 1000);
  if (next.phase === "final") setTimeout(() => Sound.flourish(), 350);

  /* The bed under each phase. `reveal` gets silence on purpose: the 450ms of
     nothing before the answer resolves is the whole point of the choreography
     (DESIGN 2.5), and a pad playing through it steps on the punchline. The
     outro starts after the flourish has had the stage to itself. */
  if (next.phase === "lobby") Sound.bed("lobby");
  else if (next.phase === "countdown" || next.phase === "question")
    Sound.bed("question");
  else if (next.phase === "reveal") Sound.bed(null);
  else if (next.phase === "final") setTimeout(() => Sound.bed("outro"), 1400);
}

/* A low tick under the last few seconds. Driven from the timer's own frame
   loop, which is the only thing that knows how much clock is left. */
function tickClock(left) {
  const whole = Math.ceil(left / 1000);
  if (whole <= 5 && whole > 0 && whole !== ticked) {
    ticked = whole;
    Sound.tick();
  }
}

/* `Shray ✓ locked in 3.2s · Nilu ···` (DESIGN 2.4). How fast they were is
   public; whether they were right is not, and is not in the payload. */
function tickFor(p) {
  const inYet = S.answered.includes(p.id);
  const t = h("div", "tick" + (inYet ? " in" : ""));
  t.style.color = p.color;
  const label = h("span", "lab");
  label.append(textNode(p.name, "var(--cream)"));
  if (inYet && typeof p.took === "number") {
    label.append(h("span", "took", ` locked in ${p.took.toFixed(1)}s`));
  } else if (inYet) {
    label.append(h("span", "took", " locked in"));
  }
  t.append(h("span", "dot"), label);
  if (!inYet) {
    const dots = h("span", "thinking");
    dots.append(h("i"), h("i"), h("i"));
    t.append(dots);
  }
  return t;
}

function refreshTicks() {
  // Mid-question we only need the "locked in" chips to update — re-rendering
  // would restart the timer animation.
  const wait = view.querySelector(".waiting");
  if (!wait) return render();
  wait.replaceChildren(...S.players.map(tickFor));
}
</script>
</body>
</html>
