# ══════════════════════════════════════════════════════════════════════════
#  LEXICONS — the robustness layer
# ══════════════════════════════════════════════════════════════════════════
#
#  Naive substring matching undercounts everything. "i love you" misses ily,
#  i love u, iloveyou, and "i loveeee youuu". compile.py does three things:
#
#  1. NORMALISE every message: NFKC, lowercase, apostrophes dropped (so "I'm"
#     and "im" unify), emoji stripped of variation selectors and skin tones
#     (❤️ → ❤), punctuation gone, whitespace collapsed.
#
#  2. EXPAND every phrase into a tolerant regex, automatically:
#        "i love you"  →  \bi+\s*l+o+v+e+\s*y+o+u+\b
#     every letter may repeat, every space is optional, word boundaries hold.
#     Catches "iloveyou" and "i loveeee youuu"; still refuses "i love your
#     hair". You never write a regex — you write the phrase.
#
#  3. LEXICONS for what regex can't reach: real synonyms and abbreviations.
#
#  Counting counts MESSAGES containing ≥1 match, so overlapping variants
#  ("love you" inside "i love you") never double-count. Use
#  mode = "occurrences" on a question for raw hits.
#
#  KEYS
#    any        list of phrases. auto-expanded as above.
#    regex      escape hatch for patterns phrases can't express.
#    emoji      matched after normalisation, skin-tone and VS16 agnostic.
#    exclude    kills false positives. checked before `any`.
#    at_start   only match at the beginning of a message. use for words that
#               are innocent mid-sentence ("morning" vs "this morning").
#
#  A lexicon is the cheapest thing in this project — one block can power four
#  questions across four different mechanics. Add freely.
# ══════════════════════════════════════════════════════════════════════════


# ── AFFECTION ─────────────────────────────────────────────────────────────

[lex.love_you]
label = "I love you"
any = ["i love you", "i love u", "ily", "ilysm", "ily2", "ilu", "iluvu",
       "love you", "love u", "luv you", "luv u", "love ya", "i heart you",
       "i <3 you", "<3 you", "love youuu"]
exclude = ["i love your", "love your", "id love to", "would love to",
           "i love it", "i love that", "i love this", "i love how",
           "i love when", "love it when"]

[lex.miss_you]
any = ["miss you", "miss u", "missing you", "missin you", "miss ya",
       "i miss you", "i miss u", "misses you", "missed you", "miss u so much",
       "wish you were here"]

[lex.pet_names]
label = "pet names"
any = ["TODO"]                 # ← babe, bub, whatever you actually call her
status = "draft"

[lex.compliment]
# Bare "you look" and "youre so" are not compliments — they matched "if you
# look at gym data" and would match "youre so late". Every phrase here has to
# carry the sentiment on its own.
any = ["you look so", "you look good", "you look great", "you look amazing",
       "you look beautiful", "you look incredible", "youre so pretty",
       "youre so cute", "youre so smart", "youre so funny", "youre so good at",
       "so proud of you", "im proud of you", "proud of you",
       "gorgeous", "beautiful", "handsome", "cutest", "prettiest", "smartest",
       "youre the best", "best thing that", "so lucky to have", "im so lucky",
       "you did amazing", "you crushed it", "nailed it"]
exclude = ["you look at", "you look into", "you look up", "you look like",
           "you look for", "youre so late", "youre so annoying"]

[lex.hearts]
emoji = ["❤", "❤️", "🩷", "💕", "💗", "💖", "💘", "💝", "🥰", "😍", "♥", "🫶"]

[lex.forever]
any = ["forever", "4ever", "4eva", "always and forever", "for life",
       "rest of my life", "rest of our lives", "the long haul"]


