# ══════════════════════════════════════════════════════════════════════════
#  THE SPELLING TELLS
#  The strongest signal in the whole thread. These are the same words — they
#  just spell them differently, and almost without exception. Each pair is a
#  `who_says_more` binary that is not a coin flip, and together they are the
#  "which of these is hers" round.
#  `at_start` is deliberately not used: the tell holds mid-sentence too.
# ══════════════════════════════════════════════════════════════════════════

[lex.spell_yea]
label = "yea"
regex = ["\\byea\\b"]

[lex.spell_imma]
label = "imma"
regex = ["\\bimma\\b"]

[lex.spell_tryna]
label = "tryna"
regex = ["\\btryna\\b"]

[lex.spell_bc]
label = "bc"
regex = ["\\bbc\\b"]

[lex.spell_wdym]
label = "wdym"
regex = ["\\bwdym\\b"]

[lex.spell_abt]
label = "abt"
regex = ["\\babt\\b"]

[lex.spell_lmfao]
label = "lmfao"
regex = ["\\blmfao+\\b"]

[lex.kms]
label = "kms"
any = ["kms", "im gonna kms", "gonna kms"]

[lex.kys]
label = "kys"
regex = ["\\bkys\\b"]

[lex.okay_slay]
label = "okay slay"
any = ["okay slay", "ok slay", "slay"]

[lex.no_yeah]
label = "no yeah"
any = ["no yeah", "yeah no"]

[lex.tmi]
label = "too much information"
# The genuinely unfiltered ones. `pee` needs a word boundary or it eats
# "peek"/"peel"; the expansion rule handles "pooped"/"pooping" on its own.
any = ["poop", "pooped", "pooping", "fart", "farted", "farting", "diarrhea",
       "constipated", "threw up", "throwing up", "puke", "puked", "puking",
       "peed", "gotta pee", "have to pee", "wanna pee"]
exclude = ["poop deck"]

[lex.tired]
label = "running on fumes"
any = ["im tired", "so tired", "im exhausted", "exhausted", "im sleepy",
       "so sleepy", "knackered", "running on fumes", "im dead", "im so dead",
       "need a nap", "cant keep my eyes open"]
