# auto/life.toml — TOPIC COVERAGE  ·  mixed types
#
# The other files are organised by mechanic, which meant the bank skewed
# meta-linguistic — lots of "who says X more". This one is organised by
# SUBJECT, so the deck has something to talk about: travel, work, illness,
# money, weather, media, pets, holidays.
#
# Everything here is a conversation starter first and a question second. The
# reveal is where you both go "oh my god, THAT week."

# ── LONG DISTANCE ─────────────────────────────────────────────────────────

[[q]]
id = "ld-busiest-travel-month"
type = "month"
kind = "The distance"
area = "travel"
prompt = "Which month had the most airport talk?"
answer = { busiest_month = true, within = "travel" }
reveal = "{month}. Peak airport."
status = "ready"

[[q]]
id = "work-worst-month"
type = "month"
kind = "Nine to five"
area = "work"
prompt = "Which month was the worst for work stress, judging by the thread?"
answer = { busiest_month = true, within = "work" }
reveal = "{month}. Judging by this thread, nobody was having a good time. It passed."
status = "ready"

[[q]]
id = "work-first-big-news"
type = "month"
kind = "Nine to five"
area = "work"
prompt = "When did one of us first share big work news — an offer, a promotion?"
source = { mine = "search", lex = "work" }
reveal = "{month}. TODO — the exact message."
status = "mine"

# ── ILLNESS AND CARE ──────────────────────────────────────────────────────

[[q]]
id = "sick-who-more"
type = "binary"
kind = "In sickness"
area = "health"
prompt = "Who gets sick more — or at least reports it more?"
options = ["{p1}", "{p2}"]
answer = { who_says_more = "sick" }
reveal = "{winner}, {n1} times to {n2}. Reporting bias is a real phenomenon."
status = "ready"

[[q]]
id = "sick-first"
type = "month"
kind = "In sickness"
area = "health"
prompt = "When did one of us first look after the other while ill?"
answer = { first_use = "sick" }
reveal = "{month}."
status = "ready"

