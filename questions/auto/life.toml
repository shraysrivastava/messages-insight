# auto/life.toml — TOPIC COVERAGE  ·  mixed types
#
# The other files are organised by mechanic, which meant the bank skewed
# meta-linguistic — lots of "who says X more". This one is organised by
# SUBJECT, so the deck has something to talk about: travel, work, illness,
# money, weather, media, pets, holidays.
#
# Everything here is a conversation starter first and a question second. The
# reveal is where you both go "oh my god, THAT week."

# ── LONG DISTANCE ─────────────────────────────────────────────────────────

[[q]]
id = "ld-countdown"
type = "number"
kind = "The distance"
area = "long-distance"
prompt = "How many times have we counted down the days to seeing each other?"
answer = { count = "long_distance" }
reveal = "{answer:,} countdowns. Every one of them ended."
status = "ready"

[[q]]
id = "ld-busiest-travel-month"
type = "month"
kind = "The distance"
area = "travel"
prompt = "Which month had the most airport talk?"
answer = { busiest_month = true, within = "travel" }
reveal = "{month}. Peak airport."
status = "ready"

[[q]]
id = "ld-first-visit-plan"
type = "month"
kind = "The distance"
area = "travel"
prompt = "When did we first book a flight to see each other?"
answer = { first_use = "travel" }
reveal = "{month}. The month seeing each other became a logistics problem."
status = "ready"

[[q]]
id = "ld-who-books"
type = "binary"
kind = "The distance"
area = "travel"
prompt = "Who talks about logistics — flights, dates, timing — more?"
options = ["{p1}", "{p2}"]
answer = { who_says_more = "travel" }
reveal = "{winner}, {n1} times. Somebody's the planner."
status = "ready"

