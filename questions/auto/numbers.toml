# auto/numbers.toml — COUNTS  ·  number  ·  self-resolving
#
# Always anchor the prompt. A blind number guess isn't a decision, it's a coin
# flip with extra steps. compile.py drops answers under 20 — proximity scoring
# is degenerate on small numbers.

[[q]]
id = "love-you-count"
type = "number"
kind = "Receipts"
area = "affection"
prompt = "We've sent {total:,} messages. How many said “I love you”?"
answer = { count = "love_you" }
reveal = "{answer:,} times. Still not enough."
# cut 2026-09-24: same count as my-final-ily-total
status = "draft"

[[q]]
id = "goodnight-count"
type = "number"
kind = "Soft launch"
area = "habits"
prompt = "How many times have we said goodnight?"
answer = { count = "goodnight", mode = "occurrences" }
reveal = "{answer:,} goodnights. Most of them from different time zones."
# cut 2026-09-24: third question on lex.goodnight, and a bare count
status = "draft"

[[q]]
id = "three-am-club"
type = "number"
kind = "Chronically online"
area = "sleep"
prompt = "How many messages have we sent between 2am and 5am?"
answer = { messages_between = [2, 5] }
reveal = "{answer:,}. Nothing good has ever been said at 4am and we said it anyway."
status = "ready"

[[q]]
id = "days-until-love"
type = "number"
kind = "First time we said it"
area = "milestones"
prompt = "How many days from our first message to the first “I love you”?"
answer = { days_until = "love_you" }
reveal = "{answer} days. Somebody was doing maths that whole time."
status = "ready"

