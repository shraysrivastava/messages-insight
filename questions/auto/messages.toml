# auto/messages.toml — REAL MESSAGES  ·  binary / choice  ·  curate.py fills these
#
# These are SLOTS, not finished questions. `status = "mine"` means curate.py
# will drop a real message into `text` (and options, and answer) when you accept
# a candidate. The compiler skips any that are still empty.
#
# This is also where PRESENTATION FORMAT varies. Same four mechanics, six very
# different-looking rounds:
#
#   bubble      one message, centred                    (who-said-it)
#   blank       one message with a word knocked out     (fill in the blank)
#   compare     two bubbles, A above B                  (which came first)
#   thread      three messages, ask about the middle    (what happened next)
#   redacted    one message, several words knocked out  (deep cut)
#   timestamp   no text at all, just a time and a date  (cold open)
#
# `format` is a rendering hint for the host screen. Unknown values fall back to
# `bubble`, so adding one never breaks the game.

# ── WHO SAID IT ───────────────────────────────────────────────────────────

[[q]]
id = "who-said-1"
type = "binary"
kind = "Who said it"
area = "language"
format = "bubble"
prompt = "Who sent this?"
options = ["{p1}", "{p2}"]
source = { mine = "who_said_it" }
reveal = "{winner} · {date}"
status = "mine"

