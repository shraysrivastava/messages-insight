# auto/who.toml — WHO SAYS IT MORE  ·  binary  ·  all self-resolving
#
# Reliably the funniest category, because the split is always more lopsided
# than either of you expects. compile.py drops any where the margin is under
# 1.25× — a near-tie is a coin flip wearing a question costume.

[[q]]
id = "more-haha"
type = "binary"
kind = "Chronically online"
area = "humor"
prompt = "Who laughs in text more — “haha” in all its forms?"
options = ["{p1}", "{p2}"]
answer = { who_says_more = "haha" }
reveal = "{winner}, {n1} times to {n2}. The average length climbs every year."
status = "ready"

[[q]]
id = "more-sorry"
type = "binary"
kind = "Damning evidence"
area = "conflict"
prompt = "Who has apologised more?"
options = ["{p1}", "{p2}"]
answer = { who_says_more = "sorry" }
reveal = "{winner}: {n1} apologies. {loser}: {n2}. Draw your own conclusions."
status = "ready"

