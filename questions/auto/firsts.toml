# auto/firsts.toml — FIRST TIME WE SAID IT  ·  month  ·  self-resolving
#
# The most generative archetype in the project: one lexicon = one finished
# question, with the real message and its date filled in automatically.
# With the density histogram behind the slider (DESIGN.md §2.3) these are the
# best-looking rounds in the game.
#
# compile.py drops any resolving into the first or last 10% of the timeline —
# guessable from the slider range alone.

[[q]]
id = "first-love-you"
type = "month"
kind = "First time we said it"
area = "milestones"
prompt = "When did one of us first say “I love you”?"
answer = { first_use = "love_you" }
reveal = "{month}. The first time either of us risked it."
status = "ready"

